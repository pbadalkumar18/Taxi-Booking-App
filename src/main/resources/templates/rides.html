<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Choose Ride</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://images.unsplash.com/photo-1502877338535-766e1452684a') no-repeat center center/cover;
}

/* overlay */
.overlay {
    background: rgba(0,0,0,0.75);
    min-height: 100vh;
    color: white;
}

/* header */
.header {
    padding: 15px;
    background: black;
}

/* ride boxes */
.ride-box {
    background: rgba(255,255,255,0.1);
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    transition: 0.3s;
    cursor: pointer;
}

.ride-box:hover {
    transform: scale(1.08);
    background: rgba(255,255,255,0.2);
    box-shadow: 0px 0px 15px #ffc107;
}

/* icons */
.icon {
    font-size: 45px;
}

/* cards */
.card {
    border-radius: 15px;
    overflow: hidden;
}

.card img {
    object-fit: cover;
}
</style>

</head>

<body>

<div class="overlay">

    <!-- HEADER -->
    <div class="header d-flex justify-content-between">
        <h4>🚖 Taxi App</h4>
        <a href="/" class="btn btn-warning btn-sm">Logout</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container text-center mt-5">

        <h1 class="mb-4">Choose Your Ride</h1>

        <!-- STATIC OPTIONS -->
        <div class="row mb-5">

            <div class="col-md-4">
                <a th:href="@{/ride-type/{type}(type='Economy')}" style="text-decoration:none; color:white;">
                    <div class="ride-box">
                        <div class="icon">🚗</div>
                        <h4>Economy</h4>
                        <p>Affordable rides</p>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/ride-type/{type}(type='Premium')}" style="text-decoration:none; color:white;">
                    <div class="ride-box">
                        <div class="icon">🚖</div>
                        <h4>Premium</h4>
                        <p>Comfort ride</p>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a th:href="@{/ride-type/{type}(type='Fast')}" style="text-decoration:none; color:white;">
                    <div class="ride-box">
                        <div class="icon">⚡</div>
                        <h4>Fast</h4>
                        <p>Quick pickup</p>
                    </div>
                </a>
            </div>

        </div>

        <!-- DYNAMIC RIDES -->
        <div class="row">

            <div class="col-md-4 mb-4" th:each="r : ${rides}">
                <div class="card p-3 text-dark shadow">

                    <img th:src="${r.imageUrl}" class="card-img-top" height="200">

                    <h4 class="mt-2" th:text="${r.name}"></h4>

                    <p class="fw-bold">₹ <span th:text="${r.price}"></span></p>

                    <a th:href="@{/book/{id}(id=${r.id})}" 
                       class="btn btn-dark w-100">
                        Book Now
                    </a>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
