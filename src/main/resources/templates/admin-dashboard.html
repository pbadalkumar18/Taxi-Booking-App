<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial;

    background: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70') no-repeat center center/cover;
}

/* dark overlay */
.overlay {
    background: rgba(0,0,0,0.85);
    min-height: 100vh;
    padding: 40px;
}

/* glass card */
.dashboard-box {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 25px;
    color: white;
}

/* table styling */
.table {
    color: white;
}

h2 {
    font-weight: bold;
}

</style>

</head>

<body>

<div class="overlay">

<div class="container">

<div class="dashboard-box">

<h2>🚖 Admin Dashboard</h2>

<h5>Welcome, <span th:text="${name}"></span></h5>

<hr>

<h4>📊 Booking Details</h4>

<table class="table table-bordered mt-3">

<thead>
<tr>
	
<th>ID</th>
<th>User Name</th>
<th>Phone</th>
<th>Pickup</th>
<th>Drop</th>
<th>Fare</th>
<th>Status</th>
<th>Driver Name</th>
<th>Driver Phone</th>
<th>Vehicle Number</th>
</tr>
</thead>

<tbody>

<tr th:each="r : ${rides}">
<td th:text="${r.id}"></td>
<td th:text="${r.user != null ? r.user.name : 'N/A'}"></td>
<td th:text="${r.user != null ? r.user.phone : 'N/A'}"></td>
<td th:text="${r.pickupLocation}"></td>
<td th:text="${r.dropLocation}"></td>
<td>₹ <span th:text="${r.fare}"></span></td>
<td th:text="${r.status}"></td>
<td th:text="${r.driver != null ? r.driver.name : 'N/A'}"></td>

<td th:text="${r.driver != null ? r.driver.phone : 'N/A'}"></td>

<td th:text="${r.driver != null ? r.driver.vehicleNumber : 'N/A'}"></td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
