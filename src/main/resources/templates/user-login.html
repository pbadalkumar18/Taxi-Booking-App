<!DOCTYPE html>
<html>
<head>
<title>User Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial, sans-serif;

    /* Car Background */
    background: url('https://images.unsplash.com/photo-1493238792000-8113da705763') no-repeat center center/cover;
}

/* Dark overlay */
.overlay {
    background: rgba(0, 0, 0, 0.7);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Login box */
.login-box {
    width: 320px;
    padding: 30px;
    border-radius: 15px;

    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);

    color: white;
}

/* Button */
.btn-yellow {
    background-color: #ffcc00;
    border: none;
    font-weight: bold;
}

.btn-yellow:hover {
    background-color: #e6b800;
}

/* Animation */
.fade-in {
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="overlay">

    <div class="login-box text-center fade-in">

        <h2 class="mb-3">🚖 User Login</h2>
        <p class="mb-4">Book your ride easily</p>

        <form action="/user-auth" method="post">

            <input type="text" name="name" placeholder="Enter Name" class="form-control mb-2" required>

            <input type="text" name="phone" placeholder="Enter Phone" class="form-control mb-3" required>

            <button class="btn btn-yellow w-100">Login</button>

        </form>

    </div>

</div>

</body>
</html>
