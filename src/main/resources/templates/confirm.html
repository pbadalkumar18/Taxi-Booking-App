<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h3>Confirm Ride</h3>

        <p><b th:text="${ride.name}"></b></p>
        <p>₹ <span th:text="${ride.price}"></span></p>

        <form action="/confirm" method="post">
            <input type="hidden" name="rideId" th:value="${ride.id}">

            <input type="text" name="pickupLocation" placeholder="Pickup" class="form-control mb-2" required>
            <input type="text" name="dropLocation" placeholder="Drop" class="form-control mb-2" required>

            <button class="btn btn-success w-100">Confirm Booking</button>
        </form>

    </div>
</div>

</body>
</html>
