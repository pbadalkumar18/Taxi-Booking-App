<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Success</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    background: url('https://images.unsplash.com/photo-1502877338535-766e1452684a') no-repeat center center/cover;
}

.overlay {
    background: rgba(0,0,0,0.7);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.box {
    text-align:center;
}
</style>
</head>

<body>

<div class="overlay">
<div class="box">

<h2>🎉 Thank You for Booking!</h2>

<img th:src="${carImage}" width="300" class="my-3 rounded">

<h4 th:text="${carName}"></h4>
<h4>💰 Total Price: ₹ <span th:text="${price}"></span></h4>

<p>🚖 Driver will arrive soon...</p>

<a href="/rides-ui" class="btn btn-warning mt-3">Book Again</a>

</div>
</div>

</body>
</html>
